<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AquaSentinel{% endblock %} | Smart Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg app-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard"><span class="brand-mark"><i class="fa-solid fa-droplet"></i></span><span>Aqua<span class="text-teal">Sentinel</span><small>PIPELINE INTELLIGENCE</small></span></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><i class="fa-solid fa-bars"></i></button>
      <div class="collapse navbar-collapse" id="nav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <a class="nav-link" href="/dashboard"><i class="fa-solid fa-grid-2 me-1"></i>Overview</a>
          <a class="nav-link" href="/monitoring"><i class="fa-solid fa-wave-square me-1"></i>Live Monitor</a>
          <a class="nav-link" href="/history"><i class="fa-solid fa-clock-rotate-left me-1"></i>History</a>
          <a class="nav-link" href="/analysis"><i class="fa-solid fa-chart-line me-1"></i>Analysis</a>
          <a class="nav-link" href="/alerts"><i class="fa-solid fa-bell me-1"></i>Alerts</a>
          <a class="nav-link" href="/innovation"><i class="fa-solid fa-lightbulb me-1"></i>Innovation</a>
        </div>
        <span class="system-pill ms-lg-3"><span class="pulse-dot"></span> Prototype Mode</span>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="app-footer"><div class="container-fluid px-4 d-flex justify-content-between flex-wrap gap-2"><span><strong>AquaSentinel</strong> / Smart Pipeline Leakage Detection</span><span>Prototype research implementation - readings are simulated</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
